<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ordem de mistura</title>
  <meta name="description" content="Informe os produtos e veja a ordem correta de adição no tanque.">
  <meta name="theme-color" content="#007AFF">
  <meta name="color-scheme" content="light">

  <!-- iOS: instalar na tela inicial -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mistura">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="app" class="app">
    <header class="topo">
      <div>
        <h1>Ordem de mistura</h1>
        <p>Sequência de adição no tanque</p>
      </div>
      <button type="button" class="texto-botao" id="abrir-produtos">Meus produtos</button>
    </header>

    <main>
      <button type="button" class="botao-primario botao-bloco botao-adicionar" id="abrir-compositor"></button>

      <!-- Compositor: revela uma etapa por vez (nome → formulação → dose + OK) -->
      <form id="form-produto" class="cartao compositor" novalidate autocomplete="off" hidden>
        <div class="compositor__topo">
          <h2 id="titulo-compositor" tabindex="-1">Novo produto</h2>
          <button type="button" class="texto-botao" id="cancelar-compositor">Cancelar</button>
        </div>

        <div class="campo">
          <label for="nome">Nome</label>
          <div class="combo">
            <input id="nome" class="input" type="text" maxlength="60" placeholder="Nome do produto"
                   role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugestoes"
                   autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="next">
            <ul id="sugestoes" class="sugestoes" role="listbox" aria-label="Produtos salvos" hidden></ul>
          </div>
        </div>

        <div class="campo etapa" id="etapa-formulacao" hidden>
          <label for="formulacao">Formulação</label>
          <select id="formulacao" class="input"></select>
        </div>

        <div class="bloco-dose etapa" id="etapa-dose" hidden>
          <div class="linha-dose">
            <div class="campo">
              <label for="dose">Dose</label>
              <input id="dose" class="input" type="text" inputmode="decimal" maxlength="8" placeholder="0" enterkeyhint="done">
            </div>
            <div class="campo">
              <label for="unidade">Unidade</label>
              <select id="unidade" class="input"></select>
            </div>
          </div>
          <button type="submit" class="botao-primario botao-bloco" id="confirmar-produto" disabled>OK</button>
        </div>
      </form>

      <div class="secao-cabecalho">
        <h2 class="secao-titulo">Sequência no tanque</h2>
        <button type="button" class="texto-botao texto-botao--perigo" id="limpar" hidden>Limpar</button>
      </div>
      <section class="cartao cartao--lista" aria-label="Sequência de mistura">
        <ol id="lista-mistura" class="passos"></ol>
        <p id="vazio" class="vazio">Adicione o primeiro produto para ver a ordem de mistura.</p>
      </section>
      <p id="dica" class="dica" hidden>Toque em um produto para editar.</p>

      <p class="rodape-nota" id="rodape-nota"></p>
    </main>
  </div>

  <!-- Botão fixo, centralizado, abre o carrossel de produtos -->
  <button type="button" class="fab" id="abrir-catalogo" aria-haspopup="dialog"></button>

  <!-- Folha: catálogo (carrossel) -->
  <div class="sheet" id="sheet-catalogo" role="dialog" aria-modal="true" aria-labelledby="titulo-catalogo" aria-hidden="true" inert>
    <div class="sheet__fundo" data-fechar></div>
    <div class="sheet__painel">
      <header class="sheet__topo">
        <h2 id="titulo-catalogo">Nossos produtos</h2>
        <button type="button" class="texto-botao" data-fechar>Fechar</button>
      </header>
      <div class="sheet__corpo sheet__corpo--catalogo" id="corpo-catalogo"></div>
    </div>
  </div>

  <!-- Folha: produtos salvos -->
  <div class="sheet" id="sheet-produtos" role="dialog" aria-modal="true" aria-labelledby="titulo-produtos" aria-hidden="true" inert>
    <div class="sheet__fundo" data-fechar></div>
    <div class="sheet__painel">
      <header class="sheet__topo">
        <h2 id="titulo-produtos">Meus produtos</h2>
        <button type="button" class="texto-botao" data-fechar>Fechar</button>
      </header>
      <div class="sheet__corpo" id="corpo-produtos"></div>
    </div>
  </div>

  <noscript><p style="padding:24px;text-align:center">Ative o JavaScript para usar o app.</p></noscript>

  <script src="data/ordem-mistura.js"></script>
  <script src="app.js"></script>
</body>
</html>
